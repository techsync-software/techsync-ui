  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #00253B;
      --green: #23CD74;
      --white: #ffffff;

      --surface: rgba(255, 255, 255, 0.06);
      --surface-hover: rgba(255, 255, 255, 0.1);
      --border: rgba(255, 255, 255, 0.1);
      --border-hover: rgba(255, 255, 255, 0.18);
      --muted: rgba(255, 255, 255, 0.62);

      --radius-btn: 16px;
      --transition: 0.2s ease;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 56px 20px 48px;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: var(--navy);
      color: var(--white);
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .page {
      width: 100%;
      max-width: 440px;
    }

    .logo {
      display: block;
      width: 220px;
      max-width: 100%;
      height: auto;
      margin: 0 auto;
    }

    .tagline {
      margin: 28px 0 0;
      font-size: 17px;
      font-weight: 400;
      line-height: 1.55;
      text-align: center;
      color: rgba(255, 255, 255, 0.9);
    }

    .location {
      margin: 18px 0 0;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-align: center;
      white-space: nowrap;
      color: var(--green);
    }

    .links {
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link {
      display: flex;
      align-items: center;
      gap: 16px;
      min-height: 64px;
      padding: 16px 20px;
      border: 1px solid var(--border);
      border-radius: var(--radius-btn);
      background-color: var(--surface);
      color: var(--white);
      text-decoration: none;
      transition: transform var(--transition), background-color var(--transition), border-color var(--transition);
    }

    .link__icon {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background-color: rgba(255, 255, 255, 0.07);
    }

    .link__text {
      flex: 1 1 auto;
      min-width: 0;
    }

    .link__title {
      display: block;
      font-size: 17px;
      font-weight: 600;
      line-height: 1.3;
    }

    .link__subtitle {
      display: block;
      margin-top: 4px;
      font-size: 15px;
      font-weight: 400;
      line-height: 1.3;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .link__arrow {
      flex: 0 0 auto;
      opacity: 0.75;
      transition: opacity var(--transition);
    }

    .link--primary {
      border-color: transparent;
      background-color: var(--green);
      color: var(--navy);
    }

    .link--primary .link__icon {
      background-color: rgba(0, 37, 59, 0.12);
    }

    .link--primary .link__subtitle {
      color: rgba(0, 37, 59, 0.72);
    }

    .link--primary .link__arrow {
      opacity: 0.85;
    }

    .share {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 40px auto 0;
      padding: 14px 26px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background-color: transparent;
      color: var(--white);
      font-family: inherit;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: transform var(--transition), background-color var(--transition), border-color var(--transition);
    }

    .footer {
      margin: 44px 0 0;
      font-size: 13px;
      font-weight: 400;
      text-align: center;
      color: rgba(255, 255, 255, 0.4);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 32px;
      transform: translate(-50%, 12px);
      padding: 12px 22px;
      border-radius: 999px;
      background-color: var(--green);
      color: var(--navy);
      font-size: 14px;
      font-weight: 600;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity var(--transition), transform var(--transition), visibility var(--transition);
    }

    .toast--error {
      background-color: var(--surface-hover);
      color: var(--white);
      border: 1px solid var(--border-hover);
    }

    .toast.is-visible {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, 0);
    }

    .link:focus-visible,
    .share:focus-visible {
      outline: 2px solid var(--green);
      outline-offset: 3px;
    }

    .link--primary:focus-visible {
      outline-color: var(--white);
    }

    @media (hover: hover) {

      .link:hover,
      .share:hover {
        transform: translateY(-1px);
        background-color: var(--surface-hover);
        border-color: var(--border-hover);
      }

      .link:hover .link__arrow {
        opacity: 1;
      }

      .link--primary:hover {
        background-color: #34DC84;
        border-color: transparent;
      }
    }

    @media (max-width: 400px) {
      body {
        padding: 40px 16px 36px;
      }

      .link {
        gap: 13px;
        padding: 14px 16px;
      }

      .link__icon {
        width: 48px;
        height: 48px;
        border-radius: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .link,
      .share,
      .toast {
        transition: none;
      }

      .link:hover,
      .share:hover {
        transform: none;
      }
    }
  </style>
</head>

        </span>
        <svg class="link__arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" />
        <polyline points="16 7 12 3 8 7" />
        <line x1="12" y1="3" x2="12" y2="15" />
      </svg>
      Compartir
    </button>

    <p class="footer">&copy; 2026 TechSync Software</p>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (function () {
      var shareButton = document.getElementById('shareButton');
      var toast = document.getElementById('toast');
      var toastTimer = null;

      function showToast(message, isError) {
        toast.textContent = message;
        toast.classList.toggle('toast--error', Boolean(isError));
        toast.classList.add('is-visible');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          toast.classList.remove('is-visible');
        }, 2200);
      }

      function copyWithTextarea(url) {
        var field = document.createElement('textarea');
        field.value = url;
        field.setAttribute('readonly', '');
        field.style.position = 'fixed';
        field.style.top = '-1000px';
        document.body.appendChild(field);
        field.select();

        var copied = false;
        try {
          copied = document.execCommand('copy');
        } catch (error) {
          copied = false;
        }
        document.body.removeChild(field);
        return copied;
      }

      function showFallbackResult(url) {
        if (copyWithTextarea(url)) {
          showToast('Enlace copiado');
          return;
        }
        showToast('No se pudo copiar el enlace', true);
      }

      function copyLink(url) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url).then(function () {
            showToast('Enlace copiado');
          }).catch(function () {
            showFallbackResult(url);
          });
          return;
        }

        showFallbackResult(url);
      }

      shareButton.addEventListener('click', function () {
        var url = window.location.href;

        if (navigator.share) {
          navigator.share({
            title: 'TechSync Software',
            text: 'Plataformas web, aplicaciones móviles y sistemas empresariales a medida.',
            url: url
          }).catch(function (error) {
            if (error && error.name === 'AbortError') {
              return;
            }
            copyLink(url);
          });
          return;
        }

        copyLink(url);
      });
    })();
  </script>
