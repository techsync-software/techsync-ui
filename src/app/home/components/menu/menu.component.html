<header [class.active]="isHeaderScrolled" class="header" data-header>
  <div class="container">

    <a href="/" class="logo">
      <img src="/assets/logo/simbolo-Blanco.png" width="74" height="24" alt="techsyncsoft logo" class="logo-light">

      <img src="/assets/logo/simbolo-Azul.png" width="74" height="24" alt="techsyncsoft logo" class="logo-dark">
    </a>

    <nav class="navbar" data-navbar [class.active]="isMenuOpen">

      <div class="navbar-top">
        <a href="/" class="logo">
          <img src="/assets/logo/simbolo-Blanco.png" width="74" height="24" alt="techsyncsoft logo">
        </a>

        <button class="nav-close-btn" aria-label="close menu" data-nav-toggler (click)="toggleMenu()">
          <i class="fa-solid fa-xmark"></i>
        </button>

      </div>

      <ul class="navbar-list">

        <li><a href="javascript:void(0)" class="navbar-link" (click)="scrollToSection('inicio')">{{ 'nav.home' | t }}</a></li>
        <li><a href="javascript:void(0)" class="navbar-link" (click)="scrollToSection('nosotros')">{{ 'nav.about' | t }}</a></li>
        <li><a href="javascript:void(0)" class="navbar-link" (click)="scrollToSection('proyectos')">{{ 'nav.projects' | t }}</a></li>
        <li><a href="javascript:void(0)" class="navbar-link" (click)="scrollToSection('blog')">{{ 'nav.blog' | t }}</a></li>
        <li><a href="javascript:void(0)" class="navbar-link" (click)="scrollToSection('footer')">{{ 'nav.contact' | t }}</a></li>

      </ul>

      <div class="wrapper">
        <a href="mailto:info&#64;techsyncsoft.com" class="contact-link">
          <i class="fa-regular fa-envelope"></i>
          {{ 'contact.footer.mail' | t }}
        </a>
        <br>
      </div>

      <div class="lang-switcher" aria-label="Idioma / Language">
        <button
          type="button"
          class="lang-btn"
          [class.active]="currentLang === 'es'"
          (click)="changeLanguage('es')"
          [attr.aria-pressed]="currentLang === 'es'"
        >
          ES
        </button>
        <button
          type="button"
          class="lang-btn"
          [class.active]="currentLang === 'en'"
          (click)="changeLanguage('en')"
          [attr.aria-pressed]="currentLang === 'en'"
        >
          EN
        </button>
      </div>

      <ul class="social-list">

        <li>
          <a href="https://www.instagram.com/techsyncsoft?igsh=dTQ4ODk3amVxMTEz&utm_source=qr" class="social-link">
            <i class="fa-brands fa-instagram"></i>
          </a>
        </li>

        <li>
          <a href="https://www.linkedin.com/company/techsync-software" class="social-link">
            <i class="fa-brands fa-linkedin-in"></i>
          </a>
        </li>
      </ul>

    </nav>

    <button class="nav-open-btn" aria-label="open menu" data-nav-toggler (click)="toggleMenu()">
      <i class="fa-solid fa-bars"></i>
    </button>

    <div
      class="overlay"
      data-nav-toggler
      data-overlay
      *ngIf="isMenuOpen"
      [class.active]="isMenuOpen"
      (click)="toggleMenu()"
    ></div>

  </div>
</header>
